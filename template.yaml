#l’en-tête
AWSTemplateFormatVersion: '2010-09-09' #CloudFormation
Transform: AWS::Serverless-2016-10-31 #Serverless
Description: Blogify - plateforme de blogs headless serverless - Template CloudFormation

# Les paramètres
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [ dev, prod ]

# Les globales 
Globals:
  Function:
    Runtime: nodejs22.x
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    Architectures: [ arm64 ]
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref BlogTable
        MEDIA_BUCKET: !Ref MediaBucket

# Les ressources
Resources:

  BlogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub blogify-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: GSI1PK
        AttributeType: S
      - AttributeName: GSI1SK
        AttributeType: S
      - AttributeName: GSI2PK
        AttributeType: S
      - AttributeName: GSI2SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: GSI1
        KeySchema:
        - AttributeName: GSI1PK
          KeyType: HASH
        - AttributeName: GSI1SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: GSI2
        KeySchema:
        - AttributeName: GSI2PK
          KeyType: HASH
        - AttributeName: GSI2SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Le bucket S3 de médias
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
        - AllowedMethods: [ GET, PUT ]
          AllowedOrigins: [ '*' ]
          AllowedHeaders: [ '*' ]
          MaxAge: 3000

  # cognito pool

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub blogify-${Stage}-users
      UsernameAttributes:
      - email
      AutoVerifiedAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub blogify-${Stage}-client
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: Administrateurs - tous les droits
      Precedence: 1

  EditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: editor
      Description: Editeurs - gerent et publient les articles
      Precedence: 2

  GuestAuthorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: guest_author
      Description: Auteurs invites - gerent leurs propres brouillons
      Precedence: 3

  # L’API de blog
  BlogApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # La fonction de santé
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref BlogApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/me.handler
      Events:
        Me:
          Type: Api
          Properties:
            RestApiId: !Ref BlogApi
            Path: /me
            Method: get

# Les sorties
Outputs:
  ApiUrl:
    Description: URL de base de l'API
    Value: !Sub https://${BlogApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  TableName:
    Description: Nom de la table DynamoDB
    Value: !Ref BlogTable

  MediaBucketName:
    Description: Nom du bucket S3 des médias
    Value: !Ref MediaBucket

  UserPoolId:
    Description: Identifiant du User Pool Cognito
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Identifiant du client Cognito
    Value: !Ref UserPoolClient
