#l’en-tête
AWSTemplateFormatVersion: '2010-09-09' #CloudFormation
Transform: AWS::Serverless-2016-10-31 #Serverless
Description: Blogify - plateforme de blogs headless serverless - Template CloudFormation

# Les paramètres
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [ dev, prod ]

# Les globales 
Globals:
  Function:
    Runtime: nodejs22.x
    CodeUri: src/
    MemorySize: 256
    Timeout: 10
    Architectures: [ arm64 ]
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref BlogTable
        MEDIA_BUCKET: !Ref MediaBucket

# Les ressources
Resources:

  BlogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub blogify-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      - AttributeName: GSI1PK
        AttributeType: S
      - AttributeName: GSI1SK
        AttributeType: S
      - AttributeName: GSI2PK
        AttributeType: S
      - AttributeName: GSI2SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: GSI1
        KeySchema:
        - AttributeName: GSI1PK
          KeyType: HASH
        - AttributeName: GSI1SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      - IndexName: GSI2
        KeySchema:
        - AttributeName: GSI2PK
          KeyType: HASH
        - AttributeName: GSI2SK
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  # L’API de blog
  BlogApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # La fonction de santé
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/health.handler
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref BlogApi
            Path: /health
            Method: get

# Les sorties
Outputs:
  ApiUrl:
    Description: URL de base de l'API
    Value: !Sub https://${BlogApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  TableName:
    Description: Nom de la table DynamoDB
    Value: !Ref BlogTable
